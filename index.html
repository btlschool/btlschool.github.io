function route(){
  call('app_state',{},true).catch(function(e){if(e&&e.code==='unknown_action')return legacyState();throw e}).then(function(st){
    S.P=null;S.me=st.me;S.order=st.order;S.sug=st.groups;S.home=st.home||null;
    if(!S.me.languages.length)return contact();
    var o=st.order;
    if(o&&o.status==='paid_pending')return status();
    if(o&&o.status==='checkout')return pay();
    var need=(st.groups||[]).filter(function(x){return x.status==='test_required'})[0];
    if(need){if((st.groups||[]).every(function(x){return x.status==='test_required'}))return contact();return testReady(need.language)}
    if(S.me.status==='subscribed'||S.me.status==='pending_payment')return home();
    groups();
  }).catch(function(e){if(e&&e.code==='unauthorized')return;hideSplash();errScreen(e)});
}
function legacyState(){return call('me',{},true).then(function(me){var st={me:me,order:null,groups:null};if(!me.languages.length)return st;return call('order_get',{},true).then(function(o){st.order=o;if(o&&o.status!=='open')return st;return call('group_suggest',{},true).then(function(g){st.groups=g;return st})})})}

function orderUI(root,words,onChange){
  var picked=[];
  function draw(){root.innerHTML='<div class="cd" style="min-height:96px;display:flex;flex-wrap:wrap;gap:8px;direction:ltr">'+picked.map(function(w,i){return '<button class="wd2 on" data-p="'+i+'">'+esc(w)+'</button>'}).join('')+words.filter(function(w,i){return picked.indexOf(i)<0&&false}).join('')+(picked.length<words.length?'<span class="wd2 gap"></span>':'')+'</div><div style="font-size:13px;font-weight:700;color:var(--mute);margin:10px 4px 6px">اضغط على الكلمة لإضافتها</div><div style="display:flex;flex-wrap:wrap;gap:8px;direction:ltr">'+words.map(function(w){return picked.indexOf(w)<0?'<button class="wd2" data-w="'+esc(w)+'">'+esc(w)+'</button>':''}).join('')+'</div>';
    on(root,'[data-w]',function(b){picked.push(b.getAttribute('data-w'));draw();onChange(picked.slice())});on(root,'[data-p]',function(b){picked.splice(+b.getAttribute('data-p'),1);draw();onChange(picked.slice())})}
  draw()}
