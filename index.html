  page({step:'الخطوة 1 من 3',pct:33,back:welcome},'<h1>كيف نتواصل معك؟</h1><div><label class="l">'+svg('user')+'الاسم واللقب بالحروف اللاتينية <em>*</em></label><input id="nm" class="ltr" autocomplete="name" placeholder="Amine Benali"><p class="sm" style="margin-top:6px">الاسم ثم اللقب، كما في الهوية، فهو الذي سيُكتب على شهادتك. للصغار: اسم الابن الذي سيدرس وليس اسم الولي.</p></div><div><label class="l">'+svg('ph')+'رقم الواتساب <em>*</em></label>'+phoneField('ph','cc')+'</div><div class="note">'+svg('info',18)+'<span>هذا الرقم وسيلة التواصل الوحيدة معك، يصلك عليه الرمز والنتيجة وكل جديد. اكتبه بعناية وتأكد منه. للصغار: رقم وليّ الأمر. تدرس من خارج الجزائر؟ اختر بلدك من القائمة قبل الرقم.</span></div>','<button class="btn" id="nx"><span>التالي</span>'+svg('next')+'</button>');
  $('nx').onclick=function(){
    var nm=$('nm').value.trim(),ph=$('ph').value.trim(),cc=$('cc').value;

    ask('<h2 style="margin:0;font-size:20px">هل رقم الواتساب هذا صحيح؟</h2><div class="cd" style="text-align:center"><span class="amt" style="font-size:26px;color:#2A1FB8">'+esc(nb(full))+'</span></div><p class="sm">سيصلك عليه رمز الدخول ونتيجة اختبارك. إن أخطأت فلن نستطيع الوصول إليك.</p><button class="btn" id="y" style="animation:none">نعم، الرقم صحيح</button><button class="btn sec" id="n">تعديل الرقم</button>',function(m){
      m.querySelector('#n').onclick=closeM;m.querySelector('#y').onclick=function(){closeM();
        S.reg=call('reg_contact',{name:nm,phone:ph,country:cc,device:navigator.userAgent.slice(0,80)},true).then(function(r){
          if(r.existing){S.reg=null;toast('هذا الرقم مسجل من قبل، سجّل الدخول',true);login();return Promise.reject({code:'handled'})}
          S.token=r.token;ls('tok',r.token)},function(e){S.reg=null;fail(e);contact();throw {code:'handled'}});
        S.reg.catch(function(){});profile()}})};
}

  var y=new Date().getFullYear(),yrs='<option value="">اختر</option>';for(var i=y-5;i>=y-80;i--)yrs+='<option>'+i+'</option>';

   '<div><label class="l">'+svg('user')+'الجنس <em>*</em></label><div class="cards2" id="gd"><button class="gd" data-g="M"><svg viewBox="0 0 24 24" stroke="#4136E6"><circle cx="10" cy="14" r="5"/><path d="M14 10l6-6M15 4h5v5"/></svg>ذكر</button><button class="gd" data-g="F"><svg viewBox="0 0 24 24" stroke="#C4087A"><circle cx="12" cy="9" r="5"/><path d="M12 14v7M9 18h6"/></svg>أنثى</button></div></div>','<button class="btn" id="nx"><span>التالي</span>'+svg('next')+'</button>');

  on($('gd'),'.gd',function(b){P.g=b.getAttribute('data-g');Array.prototype.forEach.call($('gd').children,function(x){x.classList.toggle('on',x===b)})});
  $('by').onchange=function(){var a=y-Number(this.value);$('cat').innerHTML=this.value?'<span class="chip">'+svg('chk',18).replace('<svg','<svg style="stroke:#11804A;fill:none;stroke-width:2.6"')+'فئتك: '+(a>=15?'الكبار':'الصغار')+'</span> <span class="sm">الصغار من 8 إلى 14 سنة، والكبار من 15 سنة وأكثر</span>':''};

    if(!langs.length)return toast(ERR.bad_languages,true);if(!P.g)return toast(ERR.bad_gender,true);if(!$('by').value)return toast(ERR.bad_birth_year,true);

function prep(){page({nologo:1,cls:'dark'},'<div style="margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px"><img src="assets/brand/logo-white.png" alt="" style="width:150px;animation:flt 2.4s ease-in-out infinite"><h1 style="margin:0;font-size:24px">نجهّز اختبارك…</h1><div class="bar2" style="width:140px;height:5px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden"><i style="display:block;height:100%;width:100%;background:#FFE600;border-radius:99px;animation:loadbar 1.4s ease-in-out infinite"></i></div></div>')}

// ---------- التوجيه (طلب واحد عند الفتح) ----------
function route(){
  call('app_state',{},true).catch(function(e){if(e&&e.code==='unknown_action')return legacyState();throw e}).then(function(st){
    S.P=null;S.me=st.me;S.order=st.order;S.sug=st.groups;S.home=st.home||null;
    if(!S.me.languages.length)return profile();
    var o=st.order;
    if(o&&o.status==='paid_pending')return status();
    if(o&&o.status==='checkout')return pay();
    var need=(st.groups||[]).filter(function(x){return x.status==='test_required'})[0];
    if(need)return testReady(need.language);
    if(S.me.status==='subscribed'||S.me.status==='pending_payment')return home();
    groups();
  }).catch(function(e){if(e&&e.code==='unauthorized')return;hideSplash();errScreen(e)});
}
function legacyState(){return call('me',{},true).then(function(me){var st={me:me,order:null,groups:null};if(!me.languages.length)return st;return call('order_get',{},true).then(function(o){st.order=o;if(o&&o.status!=='open')return st;return call('group_suggest',{},true).then(function(g){st.groups=g;return st})})})}
function errScreen(e){
  var c=(e&&e.code)||'?';
  $('scr').innerHTML='<div class="pg" style="justify-content:center;text-align:center"><h1 style="margin:0">تعذر تحميل المنصة</h1><p class="sub">'+esc(ERR[c]||'حدث خطأ غير متوقع')+'</p><p class="sm" dir="ltr">'+esc(c)+'</p><div class="ft"><button class="btn" id="rt">إعادة المحاولة</button><button class="lnk" id="lo2">تسجيل الخروج</button></div></div>';
  $('rt').onclick=function(){route()};$('lo2').onclick=function(){S.token='';ls('tok',null);welcome()};
}

// ---------- الاختبار ----------
function testReady(lang){
  var kd=pKids(),other=!!P0().id;
  page({title:'قبل أن تبدأ',back:other?function(){cart()}:function(){ask('<h2 style="margin:0">العودة للصفحة الرئيسية؟</h2><p class="sm">يمكنك المتابعة لاحقا بدخولك من جديد.</p><button class="btn sec" id="y">نعم</button><button class="btn" id="n" style="animation:none">البقاء هنا</button>',function(m){m.querySelector('#n').onclick=closeM;m.querySelector('#y').onclick=function(){closeM();logout()}})}},
   '<h1 style="margin-top:28px">'+(other?'اختبار '+esc(pName().split(' ')[0]):'نصائح هامة قبل بدء الاختبار')+'</h1><div class="tips">'+
   '<div class="tip"><div class="ti" style="background:#EEEDFF"><svg viewBox="0 0 24 24" stroke="#4136E6">'+IC.timer+'</svg></div><b>15 دقيقة</b><span>'+(kd?'24 سؤالا ممتعا، ويبدأ العدّ عند الضغط على «ابدأ»':'يبدأ العد فور الضغط على «ابدأ»')+'</span></div>'+
   '<div class="tip"><div class="ti" style="background:#E3F8EC"><svg viewBox="0 0 24 24" stroke="#11804A">'+IC.head+'</svg></div><b>سماعات وهدوء</b><span>مكان هادئ وإنترنت مستقر</span></div>'+
   '<div class="tip"><div class="ti" style="background:#FFF1D6"><svg viewBox="0 0 24 24" stroke="#E08600">'+IC.user+'</svg></div><b>'+(kd?'أجب بنفسك يا بطل':'أجب بنفسك وبصدق')+'</b><span>'+(kd?'لا نجاح ولا رسوب، نريد فقط أن نضعك مع أصدقاء في مستواك':'لا نجاح ولا رسوب، فأجب بمصداقية كي تنضم للفوج الذي يناسبك')+'</span></div>'+
   '<div class="tip"><div class="ti" style="background:#FFE8F4"><svg viewBox="0 0 24 24" stroke="#C4087A">'+IC.back+'</svg></div><b>تخطَّ بثقة</b><span>'+(kd?'لا بأس، انتقل إلى السؤال التالي':'لا تتوقف عند سؤال صعب')+'</span></div></div>',
   '<button class="btn" id="st"><span>ابدأ اختبار '+LANG[lang]+'</span>'+svg('next')+'</button>');
  $('st').onclick=function(){var d={language:lang};if(P0().id)d.person_id=P0().id;call('test_start',d).then(runTest,fail)};
}
function runTest(t){
  var T=S.T={t:t,idx:0,sel:-1,plays:0,left:t.remaining_sec,done:false};
  for(var i=0;i<t.questions.length;i++){if(t.answers&&t.answers[t.questions[i].qid]===undefined){T.idx=i;break}if(i===t.questions.length-1)T.idx=t.questions.length}
  if(T.idx>=t.questions.length)return finishTest(false);
  showQ();
  stopTest();testIv=setInterval(function(){T.left--;var e=$('tm');if(e)e.textContent=mmss(T.left);if(T.left<=0&&!T.done){T.done=true;finishTest(true)}},1000);
}
function mmss(s){s=Math.max(0,s);return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2)}
function showQ(){
  var T=S.T,q=T.t.questions[T.idx];T.sel=-1;T.plays=0;
  var skills=['grammar','vocab','reading','listening'];
  var body='<div class="sk">'+skills.map(function(k){return '<span class="'+(k===q.skill?'on':'')+'">'+skl(k)+'</span>'}).join('')+'</div>'+
   '<div class="cd" style="margin-top:2px">'+(q.skill==='listening'||q.audio_text?'<button class="btn sec" id="pl" style="margin-bottom:12px;min-height:48px;font-size:15px">'+svg('speaker')+' استمع (مرتان فقط)</button>':'')+'<div class="q">'+esc(q.stem)+'</div></div>'+
   q.options.map(function(o,i){return '<button class="opt" data-i="'+i+'"><i></i><span>'+esc(o)+'</span></button>'}).join('');
  page({step:'السؤال '+(T.idx+1)+' من '+T.t.total,pct:Math.round(T.idx/T.t.total*100),nologo:true,
   right:'<div class="tm"><svg viewBox="0 0 24 24">'+IC.timer+'</svg><span id="tm">'+mmss(T.left)+'</span></div>',back:function(){exitAsk()}},body,'<button class="btn" id="nx" disabled><span>التالي</span>'+svg('next')+'</button><button class="lnk" id="sk">لا أعرف الإجابة، تخطَّ السؤال</button>');
  $('scr').querySelector('.hd').insertBefore($('scr').querySelector('.hd .tm'),$('scr').querySelector('.hd .ib'));
  on($('scr'),'.opt',function(b){T.sel=+b.getAttribute('data-i');Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(x){x.classList.toggle('on',x===b)});$('nx').disabled=false});
  if($('pl'))$('pl').onclick=function(){if(T.plays>=2)return toast('استنفدت مرتي الاستماع');T.plays++;speak(q.audio_text||q.stem,T.t.language);if(T.plays>=2)$('pl').disabled=true};
  $('nx').onclick=function(){if(T.sel<0||this.getAttribute('data-lock'))return;this.setAttribute('data-lock','1');sendAnswer(T,q,T.sel);next()};
  $('sk').onclick=next;
}
function exitAsk(){ask('<h2 style="margin:0">الخروج من الاختبار؟</h2><p class="sm">الوقت لا يتوقف. يمكنك العودة وإكمال ما بقي قبل أن ينتهي.</p><button class="btn" id="c" style="animation:none">أكمل الاختبار</button><button class="btn bad" id="l">اخرج الآن</button>',function(m){m.querySelector('#c').onclick=closeM;m.querySelector('#l').onclick=function(){closeM();S.T.done=true;stopTest();if(P0().id)cart();else welcome()}})}
function speak(text,lang){try{var u=new SpeechSynthesisUtterance(text);u.lang=lang==='FR'?'fr-FR':'en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('جهازك لا يدعم تشغيل الصوت',true)}}
function sendAnswer(T,q,choice){
  T.q=(T.q||Promise.resolve()).then(function(){
    function go(n){return call('test_answer',{test_id:T.t.test_id,qid:q.qid,choice:choice},true).catch(function(e){if((e.code==='network'||e.code==='timeout')&&n<3)return new Promise(function(r){setTimeout(r,1500)}).then(function(){return go(n+1)});throw e})}
    return go(0);
  }).then(function(r){if(T.done)return;if(r.stop)return finishTest(false);if(r.offer_beginner)beginnerOffer()},function(e){if(e.code==='time_up'||e.code==='test_closed'){if(!T.done){finishTest(true)}}else{T.lost=(T.lost||0)+1}});
}
function next(){var T=S.T;T.idx++;if(T.idx>=T.t.questions.length){T.done=true;return finishTest(false)}showQ()}
function beginnerOffer(){ask('<h2 style="margin:0">هل الأسئلة صعبة عليك؟</h2><p>إن كانت أغلبها صعبة فيمكنك أن تبدأ من مستوى المبتدئ A1 مباشرة، دون إتمام الاختبار.</p><button class="btn" id="b" style="animation:none">ابدأ من المبتدئ</button><button class="btn sec" id="c">سأكمل الاختبار</button>',function(m){
  m.querySelector('#c').onclick=closeM;
  m.querySelector('#b').onclick=function(){closeM();S.T.done=true;S.T.fin=true;stopTest();busy(true);(S.T.q||Promise.resolve()).then(function(){return call('test_beginner_stop',{test_id:S.T.t.test_id})}).then(function(r){showResult(S.T.t.language,r)},fail)}})}
function finishTest(timedOut){var T=S.T;if(T.fin)return;T.fin=true;T.done=true;stopTest();busy(true);(T.q||Promise.resolve()).then(function(){return call('test_finish',{test_id:T.t.test_id})}).then(function(r){showResult(T.t.language,r)},fail)}

// ---------- النتيجة ----------
function ring(r){var kd=pKids();var pct=r.total?Math.min(1,r.score/r.total):0,C=2*Math.PI*54;return '<div class="ring"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="54" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="12"/><circle cx="66" cy="66" r="54" fill="none" stroke="#FFE600" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(C*pct).toFixed(1)+' '+C.toFixed(1)+'"/></svg><div class="in"><b>'+esc(r.level)+'</b><span>'+(kd?'من 6':esc(LVL[r.level]||''))+'</span></div></div>'}
function showResult(lang,r,pick){
  pRes()[lang]=r;clearTimers();setPSug((pSug()||[]).map(function(x){return x.language===lang&&x.status==='test_required'?{language:lang,status:'done'}:x}));
  var cur=pick||lang,cr=pRes()[cur],langs=Object.keys(pRes());
  var more=(pSug()||[]).filter(function(x){return x.status==='test_required'})[0];
  var sk=Object.keys(cr.skills||{}),min=sk.reduce(function(a,k){return a===null||cr.skills[k].pct<cr.skills[a].pct?k:a},null);
  var bars=sk.map(function(k){var s=cr.skills[k];return '<div class="row" style="gap:10px;margin:8px 0"><span style="width:62px;font-weight:700;font-size:13px">'+skl(k)+'</span><div class="bar"><i class="'+(k===min&&sk.length>1?'lo':'')+'" style="width:'+s.pct+'%"></i></div><b style="width:42px;text-align:left;direction:ltr">'+s.pct+'%</b></div>'}).join('');
  var conf='';for(var i=0;i<16;i++)conf+='<i class="conf" style="left:'+(i*6.4)+'%;background:'+['#FFE600','#FF6A7A','#7CF0C0','#9391FC','#FFA43A'][i%5]+';animation-delay:'+(i%8*.35)+'s"></i>';
  page({title:'نتيجتك',cls:'dark',nologo:false},conf+'<div style="text-align:center;margin-top:18px;animation:up .5s ease both"><div style="font-weight:700;color:#E4E2FF">أحسنت، أنهيت الاختبار</div><div style="font-size:30px;font-weight:900;margin:4px 0">مبروك يا <span style="color:#FFE600">'+esc(pName().split(' ')[0])+'</span></div><div style="color:#E4E2FF;font-size:14px">هذا مستواك في كل لغة، ومنه تنطلق رحلتك</div></div>'+
   '<div class="cards2" style="margin-top:6px">'+langs.map(function(l){var x=pRes()[l];return '<button class="rc'+(l===cur?' on':'')+'" data-r="'+l+'"><div style="margin-bottom:8px">'+LANG[l]+'</div>'+ring(x)+'<div style="margin-top:8px"><span class="tag" style="background:#FFE600;color:#1B1740">'+(pKids()?'ابدأ من المستوى '+esc(x.level):'مستواك '+esc(x.level))+'</span></div></button>'}).join('')+'</div>'+
   (langs.length>1?'<div class="sm" style="text-align:center;color:#E4E2FF">اضغط على اللغة لترى مهاراتك فيها</div>':'')+
   '<div class="cd" style="color:var(--ink)"><div class="row"><b>'+(pKids()?'نجومك في ':'مهاراتك في ')+LANG[cur]+'</b>'+(min&&sk.length>1?'<span class="tag wr">'+skl(min)+' فرصة للتطور</span>':'')+'</div>'+bars+(min&&sk.length>1?'<div class="sm" style="text-align:center;margin-top:6px">لا تقلق، سيركّز أستاذك على تقوية '+SK[min]+' معك.</div>':'')+'</div>',
   more?'<button class="btn gold" id="mr"><span>اختبر مستواك في '+LANG[more.language]+'</span>'+svg('next')+'</button>':(P0().id?'<button class="btn gold" id="gp"><span>العودة إلى السلة</span>'+svg('next')+'</button>':'<button class="btn gold" id="gp"><span>اعرض فوجي المناسب</span>'+svg('next')+'</button>'));
  on($('scr'),'.rc',function(b){showResult(lang,r,b.getAttribute('data-r'))});
  if(more)$('mr').onclick=function(){testReady(more.language)};else $('gp').onclick=function(){if(P0().id)return cart();call('group_suggest',{},true).then(function(g){S.sug=g;groups()},fail)};
}

// ---------- الفوج والطلب ----------
function whenTxt(g){return g.schedule.map(function(s){return DAYS[s.d]+' '+s.t}).join(' و ')}
function dateTxt(d){try{return new Date(d+'T12:00:00').toLocaleDateString('ar-DZ-u-nu-latn',{day:'numeric',month:'long'})}catch(e){return d}}
function groups(){
  var list=(S.sug||[]).filter(function(x){return x.status==='ok'});
  if(!list.length){return call('group_suggest',{},true).then(function(g){S.sug=g;if(g.some(function(x){return x.status==='ok'}))groups();else testReady((g[0]||{}).language||'EN')},fail)}

  Promise.all([call('app_state',{},true),call('invite_list',{},true).catch(function(){return[]})]).then(function(a){
    busy(false);var st=a[0],inv=a[1]||[];S.me=st.me;S.P=null;
    var kids={};(S.me.children||[]).forEach(function(c){kids[c.id]=c});var invs={};inv.forEach(function(i){invs[i.person_id]=i});S.hasInvites=inv.length>0;
    var lines=[];
    var selfLangs=(S.sug||[]).filter(function(x){return x.status==='ok'&&S.sel[x.language]!==false}).map(function(x){return x.language});
    if(!selfLangs.length&&S.me.languages)selfLangs=S.me.languages.slice();
    selfLangs.forEach(function(l){lines.push({language:l})});
    (S.me.children||[]).forEach(function(c){if(c.status==='subscribed')return;(c.languages||[]).forEach(function(l){lines.push({person_id:c.id,language:l})})});
    inv.forEach(function(i){if(i.status==='expired'||i.status==='tested'&&false)return;(i.languages||[]).forEach(function(l){lines.push({person_id:i.person_id,language:l})})});
    return call('order_save',{lines:lines}).then(function(o){drawCart(o,kids,invs)});
  }).catch(function(e){busy(false);if(e&&e.code==='order_locked')return route();fail(e)});
}
function drawCart(o,kids,invs){
  var by={},order=[];o.lines.forEach(function(l){var k=l.person_id||'me';if(!by[k]){by[k]=[];order.push(k)}by[k].push(l)});
  var ready=o.lines.filter(function(l){return l.state==='ready'}).length;
  var people=order.map(function(k){
    var ls_=by[k],first=ls_[0],kid=kids[k]||(k==='me'&&S.me.ageGroup==='kids'),inv=invs[k];
    var rows=ls_.map(function(l){return '<div class="row" style="padding:8px 0;border-top:1px dashed var(--line)"><div><b style="font-size:13.5px">'+LANG[l.language]+'</b><div class="sm" dir="ltr" style="text-align:right">'+(l.state==='ready'?esc(l.group_code):'—')+'</div></div>'+(l.state==='ready'?'<span class="amt" style="font-size:14px">'+esc(nb(l.price))+' DA</span>':'<span class="tag wr">لم يُجرِ الاختبار</span>')+'</div>'}).join('');
    var waiting=ls_.some(function(l){return l.state==='waiting_test'}),act='';
    if(waiting&&k!=='me'){act=(inv&&inv.mode==='admin')?'<div class="sm" style="margin-top:6px">الإدارة تتواصل معه لإجراء الاختبار.</div>':'<button class="btn sec" data-tp="'+esc(k)+'" style="margin-top:8px;min-height:46px;font-size:15px;animation:none">ابدأ اختباره الآن</button>'}
    return '<div class="cd"><div class="row" style="justify-content:flex-start;gap:10px;margin-bottom:6px"><span class="num" style="width:34px;height:34px;font-size:16px;background:'+(kid?'#FFF1D6':'#EEEDFF')+'">'+esc((first.name||'?').charAt(0).toUpperCase())+'</span><b style="font-size:16px" dir="ltr">'+esc(first.name)+'</b><span class="tag '+(kid?'wr':'pu')+'">'+(kid?'طفل':'بالغ')+'</span></div>'+rows+act+'</div>'}).join('');
  var tot='<div class="sum" style="margin-top:4px"><div class="row" style="font-size:13px;color:#DAD8FF;font-weight:700"><span>'+ready+' '+(ready===1?'فوج':'أفواج')+'</span><span class="amt">'+esc(nb(o.gross))+' DA</span></div>'+(o.discount?'<div class="row y" style="font-size:13px;margin-top:4px"><span>خصم '+ready+' أفواج '+o.tier_pct+'%</span><span class="amt">'+esc(nb(o.discount))+' DA</span></div>':'')+'<div class="row" style="margin-top:8px"><b>المجموع للدفع</b><span class="amt" style="font-size:24px">'+esc(nb(o.net))+' DA</span></div><div style="font-size:12.5px;font-weight:700;color:#DAD8FF;text-align:left">'+esc(words(netCents(o)))+'</div></div>';
  page({title:'سلة التسجيل',back:function(){S.sug&&S.sug.some(function(x){return x.status==='ok'})?groups():route()}},'<h1 style="font-size:22px;margin:26px 0 0">كل تسجيلاتك في دفعة واحدة</h1>'+people+'<button class="btn sec" id="ad">+ إضافة شخص آخر</button>'+(ready?tot:''),
   '<button class="btn" id="go2"'+(ready?'':' disabled')+'><span>تابع إلى الدفع</span>'+svg('next')+'</button>');
  $('ad').onclick=addPerson;
  on($('scr'),'[data-tp]',function(b){var id=b.getAttribute('data-tp'),c=kids[id],iv=invs[id];S.P={id:id,name:(c&&c.name)||(by[id][0].name),kids:!!c,results:{}};startPersonTests()});
  $('go2').onclick=function(){
    function checkout(){call('order_checkout').then(function(x){S.order=x;pay()},fail)}
    if(o.waiting>0){return ask('<h2 style="margin:0">بعضهم لم ينهِ اختباره</h2><p class="sm">يمكنك الدفع الآن عن الجاهزين، ويدفع الباقون لاحقا من طلب آخر بعد إنهاء اختبارهم (دون خصم الدفعة الواحدة).</p><button class="btn" id="y" style="animation:none">ادفع عن الجاهزين الآن</button><button class="btn sec" id="n">رجوع لإكمال الاختبارات</button>',function(m){m.querySelector('#n').onclick=closeM;m.querySelector('#y').onclick=function(){closeM();call('order_drop_waiting').then(checkout,fail)}})}
    checkout()};
}

// ---------- الإقلاع ----------
(function(){var t=ls('tok'),sp=$('sp');if(sp)sp.onclick=skipSplash;if(t){S.token=t;route()}else{welcome();setTimeout(function(){call('ping',{},true).catch(function(){})},50)}})();
})();
</script>
