<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة إدارة BTL</title>
<link rel="icon" href="assets/icons/icon-192.png">
<style>
:root{--ink:#1B1740;--mute:#5B5780;--brand:#4136E6;--brand2:#2A1FB8;--line:#DCDAF5;--soft:#EEEDFF;--bg:#F6F5FF;--ok:#0E5E37;--okbg:#E3F8EC;--bad:#D93A3A;--warn:#FFF1D6}
*{box-sizing:border-box}html,body{margin:0}body{font-family:'Expo Arabic','Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer}.hidden{display:none!important}
header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;margin:0}header small{opacity:.8}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:start;width:100%}
.stat b{font-size:26px;display:block;color:var(--brand2)}.stat span{font-size:12px;color:var(--mute)}.stat.alert b{color:var(--bad)}
h2{font-size:15px;margin:14px 0 8px}
.mute{color:var(--mute);font-size:12px}
.amt{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--brand);color:#fff;font-weight:700}
.btn.sec{background:var(--soft);color:var(--brand2)}.btn.bad{background:#fff;color:var(--bad);border:1px solid var(--bad)}.btn.ok{background:var(--ok)}
.btn[disabled]{opacity:.5}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btns .btn{flex:1;min-width:110px}
.tag{display:inline-block;background:var(--soft);color:var(--brand2);border-radius:999px;padding:2px 9px;font-size:11px}.tag.urgent{background:var(--warn);color:#8a5200}
nav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 2px;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button.on{color:var(--brand)}nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:3px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:16px;padding:0 4px;line-height:16px}
img.rc{width:100%;border-radius:12px;border:1px solid var(--line);max-height:60vh;object-fit:contain;background:#fff}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:70px;direction:ltr;text-align:left}input[type=number],input.ltr{direction:ltr;text-align:left}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 4px}
details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0 12px}summary{padding:12px 0;font-weight:700;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(246,245,255,.8);display:flex;align-items:center;justify-content:center;z-index:50}
.sp{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:84px;inset-inline:16px;margin:auto;max-width:420px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;z-index:60;text-align:center}#toast.err{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(27,23,64,.5);display:flex;align-items:flex-end;justify-content:center;z-index:55}.modal>div{background:#fff;border-radius:18px 18px 0 0;padding:16px;width:100%;max-width:640px}
#login{max-width:420px;margin:12vh auto;padding:16px;text-align:center}
</style>
</head>
<body>
<div id="ov" class="hidden"><div class="sp"></div></div>
<div id="toast" class="hidden"></div>
<div id="modal" class="modal hidden"><div id="mbody"></div></div>

<section id="login" class="hidden">
  <img src="assets/icons/icon-192.png" width="72" height="72" alt="" style="border-radius:18px">
  <h2 style="font-size:19px">لوحة إدارة BTL</h2>
  <p class="mute">سجّل الدخول بحساب Google المعتمد لدى المدرسة.</p>
  <div id="gbtn" style="display:flex;justify-content:center;margin-top:14px"></div>
  <p id="lmsg" class="mute"></p>
</section>

<div id="app" class="hidden">
  <header><div><h1 id="title">الإدارة</h1><small id="who"></small></div><button class="btn sec" id="out" style="padding:7px 12px">خروج</button></header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<script src="config.js"></script>
<script>
(function(){
'use strict';
var CFG=window.BTL_CONFIG||{},TOK='',STAFF=null,TAB='inbox',INBOX=null;
var ERR={unauthorized:'انتهت الجلسة، سجّل الدخول من جديد',forbidden:'لا تملك صلاحية هذا الإجراء',bad_credentials:'هذا الحساب غير معتمد في الإدارة',not_found:'العنصر غير موجود أو أُغلق',not_allowed:'تمت معالجته من إداري آخر',note_required:'اكتب سبب الرفض',telegram_not_linked:'حساب تلغرام غير مربوط، استخدم واتساب',bad_value:'قيمة غير صالحة',auth_not_ready:'تسجيل الدخول غير مهيأ بعد',rate_limited:'محاولات كثيرة، انتظر قليلا',maintenance:'المنصة في الصيانة',network:'تعذر الاتصال، تحقق من الشبكة'};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function da(s){return '<span class="amt">'+esc(String(s).replace(/ /g,' '))+' DA</span>'}
function store(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}
function toast(m,bad){var t=$('toast');t.textContent=m;t.className=bad?'err':'';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className='hidden'},3200)}
function busy(on){$('ov').classList.toggle('hidden',!on)}
function api(action,data,silent){
  if(!CFG.apiUrl)return Promise.reject({code:'auth_not_ready'});
  if(!silent)busy(true);
  return fetch(CFG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:action,token:TOK,data:data||{}})})
   .then(function(r){return r.json()},function(){throw {code:'network'}})
   .then(function(j){if(!j.ok)throw {code:j.error};return j.result})
   .then(function(x){busy(false);return x},function(e){busy(false);if(e&&e.code==='unauthorized')logout(true);throw e})
}
function fail(e){var c=e&&e.code;toast(ERR[c]||('حدث خطأ، حاول مجددا'+(c?' ('+c+')':'')),true);var v=$('view');if(v&&!v.innerHTML.trim())v.innerHTML='<div class="card"><b>تعذر تحميل البيانات</b><p class="mute">'+esc(ERR[c]||('رمز الخطأ: '+(c||'؟')))+'</p><button class="btn" id="retry">إعادة المحاولة</button></div>',$('retry').onclick=function(){start()}}
function ask(html,cb){$('mbody').innerHTML=html;$('modal').classList.remove('hidden');cb&&cb($('mbody'))}
function closeModal(){$('modal').classList.add('hidden');$('mbody').innerHTML=''}
$('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});

// ---------- الدخول ----------
function logout(expired){TOK='';STAFF=null;store('t',null);$('app').classList.add('hidden');showLogin(expired?ERR.unauthorized:'')}
function showLogin(msg){
  $('login').classList.remove('hidden');$('lmsg').textContent=msg||'';
  if(!CFG.googleClientId||!CFG.apiUrl){$('lmsg').textContent='لم يُضبط الربط بعد (apiUrl / googleClientId في config.js).';return}
  if(window.google&&google.accounts){initG();return}
  var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=initG;document.head.appendChild(s);
}
function initG(){
  google.accounts.id.initialize({client_id:CFG.googleClientId,callback:function(r){
    api('staff_login',{idToken:r.credential,device:navigator.userAgent.slice(0,80)}).then(function(x){TOK=x.token;STAFF=x.staff;store('t',TOK);start()},function(e){$('lmsg').textContent=ERR[e.code]||'تعذر الدخول'})}});
  $('gbtn').innerHTML='';google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large',text:'signin_with',locale:'ar'});
}
$('out').onclick=function(){var t=TOK;api('staff_logout',{},true).then(function(){},function(){});TOK='';store('t',null);logout()};

// ---------- الهيكل ----------
var ICON={stops:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',inbox:'<path d="M3 13l2-8h14l2 8M3 13v6h18v-6M3 13h5l1 2h6l1-2h5"/>',pay:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h3"/>',contact:'<path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.5A8 8 0 1121 12z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 00-2-1.2L14 3h-4l-.6 2.7a7 7 0 00-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 000 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 002 1.2L10 21h4l.6-2.7a7 7 0 002-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/>'};
function renderNav(){
  var tabs=[['inbox','الوارد'],['pay','المدفوعات'],['contact','التواصل'],['stops','التوقف']];
  if(STAFF&&STAFF.role==='admin')tabs.push(['settings','الإعدادات']);
  var cnt={pay:INBOX&&INBOX.payments_pending,contact:INBOX&&INBOX.outreach_pending,stops:INBOX&&INBOX.stops_pending};
  $('nav').innerHTML=tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'"><svg viewBox="0 0 24 24">'+ICON[t[0]]+'</svg>'+t[1]+(cnt[t[0]]?'<span class="badge">'+cnt[t[0]]+'</span>':'')+'</button>'}).join('');
  Array.prototype.forEach.call($('nav').children,function(b){b.onclick=function(){go(b.getAttribute('data-t'))}});
}
function go(t){TAB=t;var f={inbox:vInbox,pay:vPay,contact:vContact,stops:vStops,settings:vSettings}[t];$('title').textContent={inbox:'الإدارة',pay:'المدفوعات',contact:'بانتظار التواصل',stops:'طلبات التوقف',settings:'الإعدادات'}[t];renderNav();f()}
function start(){
  $('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=(STAFF&&STAFF.name)||'';
  api('staff_inbox').then(function(x){INBOX=x;STAFF=Object.assign({},STAFF,x.staff);$('who').textContent=STAFF.name;go('inbox')},function(e){renderNav();fail(e)});
}
function refreshInbox(){return api('staff_inbox',{},true).then(function(x){INBOX=x;renderNav()},function(){})}
function ago(iso){var h=Math.max(0,Math.round((Date.now()-new Date(iso+'+01:00').getTime())/36e5));if(h<1)return 'قبل قليل';if(h<24)return 'منذ '+h+' ساعة';return 'منذ '+Math.round(h/24)+' يوم'}

// ---------- الوارد ----------
function vInbox(){
  var i=INBOX||{};
  $('view').innerHTML='<h2>يحتاج إلى انتباهك</h2><div class="stats">'+
   '<button class="stat'+(i.payments_pending?' alert':'')+'" data-g="pay"><b>'+(i.payments_pending||0)+'</b><span>مدفوعات بانتظار التأكيد</span></button>'+
   '<button class="stat'+(i.outreach_urgent?' alert':'')+'" data-g="contact"><b>'+(i.outreach_pending||0)+'</b><span>بانتظار التواصل'+(i.outreach_urgent?' ('+i.outreach_urgent+' عاجل)':'')+'</span></button>'+
   '<button class="stat'+(i.stops_final?' alert':'')+'" data-g="stops"><b>'+(i.stops_pending||0)+'</b><span>طلبات توقف'+(i.stops_final?' ('+i.stops_final+' نهائي)':'')+'</span></button>'+
   '<div class="stat"><b>'+(i.orders_unpaid||0)+'</b><span>طلبات لم تُدفع بعد</span></div></div>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-g]'),function(b){b.onclick=function(){go(b.getAttribute('data-g'))}});
}

// ---------- المدفوعات ----------
function vPay(){
  api('staff_payment_list').then(function(list){
    $('view').innerHTML=list.length?list.map(function(p,i){return '<div class="card"><div class="row"><b>'+esc(p.payer)+'</b><span class="mute">'+esc(ago(p.submitted_at))+'</span></div>'+
      p.lines.map(function(l){return '<div class="mute" style="margin-top:4px">'+esc(l.name)+' · '+esc(l.group_code)+(l.discount_pct?' · خصم '+l.discount_pct+'%':'')+'</div>'}).join('')+
      '<div class="row" style="margin-top:8px"><span>'+da(p.amount)+' <span class="tag">'+esc(p.account)+'</span></span><button class="btn" data-i="'+i+'">راجع</button></div></div>'}).join(''):'<div class="card mute">لا توجد وصولات بانتظار المراجعة.</div>';
    Array.prototype.forEach.call($('view').querySelectorAll('[data-i]'),function(b){b.onclick=function(){review(list[+b.getAttribute('data-i')])}});
  },fail)
}
function review(p){
  $('title').textContent='مراجعة الدفع';
  $('view').innerHTML='<button class="btn sec" id="back">رجوع</button><div class="card" style="margin-top:10px"><div class="row"><b>'+esc(p.payer)+'</b><span class="tag">'+esc(p.order_id)+'</span></div>'+
   p.lines.map(function(l){return '<div class="row" style="margin-top:6px"><span>'+esc(l.name)+' · '+esc(l.group_code)+'</span><span>'+da(l.net)+'</span></div>'}).join('')+
   '<div class="row" style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px"><span>المتوقع</span>'+da(p.amount)+'</div><div class="mute">الحساب: '+esc(p.account)+'</div></div>'+
   '<div class="card"><div id="rimg" class="mute">تحميل صورة الوصل…</div></div>'+
   '<div class="btns"><button class="btn ok" id="yes">تأكيد الدفع وإضافته إلى الفوج</button><button class="btn bad" id="no">رفض مع السبب</button></div><p class="mute">يُسجَّل من أكّد ومتى، ولا يُحذف السجل.</p>';
  $('back').onclick=function(){go('pay')};
  api('staff_payment_receipt',{payment_id:p.payment_id},true).then(function(r){$('rimg').innerHTML='<img class="rc" alt="وصل الدفع" src="data:'+esc(r.mime)+';base64,'+esc(r.b64)+'">'},function(){$('rimg').textContent='تعذر تحميل الصورة'});
  $('yes').onclick=function(){ask('<h2>تأكيد الدفع؟</h2><p>سيُضاف '+da(p.amount)+' إلى الدفتر ويُؤكَّد الاشتراك.</p><div class="btns"><button class="btn ok" id="y2">نعم، أكّد</button><button class="btn sec" id="c2">إلغاء</button></div>',function(m){
    m.querySelector('#c2').onclick=closeModal;m.querySelector('#y2').onclick=function(){closeModal();decide(p,'confirm')}})};
  $('no').onclick=function(){ask('<h2>سبب الرفض</h2><select id="rs"><option>الوصل غير واضح</option><option>المبلغ غير مطابق</option><option>الحوالة غير موجودة في كشف الحساب</option><option>صورة مكررة</option><option value="">سبب آخر…</option></select><label>ملاحظة تصل للمشترك</label><input id="rn" maxlength="150"><div class="btns"><button class="btn bad" id="n2">رفض</button><button class="btn sec" id="c3">إلغاء</button></div>',function(m){
    m.querySelector('#c3').onclick=closeModal;m.querySelector('#n2').onclick=function(){var note=(m.querySelector('#rs').value+' '+m.querySelector('#rn').value).trim();closeModal();decide(p,'reject',note)}})};
}
function decide(p,d,note){api('staff_payment_review',{payment_id:p.payment_id,decision:d,note:note}).then(function(){toast(d==='confirm'?'تم تأكيد الدفع':'تم رفض الوصل');refreshInbox();go('pay')},function(e){fail(e);if(e.code==='not_allowed')go('pay')})}

// ---------- التواصل ----------
var KIND={test_link:'رابط الاختبار',code_ready:'رمز الدخول'};
function vContact(){
  api('staff_outreach_list').then(function(list){
    $('view').innerHTML=list.length?list.map(function(o,i){
      var hint=o.person.telegram?(o.suggested==='tg'?'تلغرام: مربوط. الرسالة تصله عبر البوت باسمه الحقيقي.':'لم يردّ على تلغرام منذ 24 ساعة. جرّب واتساب.'):'تلغرام: غير مربوط. أرسل له على واتساب الرابط مع رابط ربط البوت.';
      return '<div class="card"><div class="row"><b>'+esc(o.person.name)+'</b><span class="tag'+(o.urgent?' urgent':'')+'">'+esc(KIND[o.kind]||o.kind)+'</span></div><div class="mute"><span class="amt">'+esc(o.person.phone)+'</span>'+(o.requested_by?' · سجّله '+esc(o.requested_by):'')+' · '+esc(ago(o.since))+'</div><p class="mute" style="margin:8px 0 0">'+esc(hint)+'</p>'+
      '<div class="btns">'+(o.person.telegram&&o.suggested==='tg'?'<button class="btn" data-a="tg" data-i="'+i+'">إرسال عبر البوت</button>':'<button class="btn" data-a="wa" data-i="'+i+'">فتح واتساب</button>')+
      (o.person.telegram&&o.suggested==='wa'?'<button class="btn sec" data-a="tg" data-i="'+i+'">عبر البوت</button>':'')+'<button class="btn sec" data-a="done" data-i="'+i+'">تم</button></div></div>'}).join(''):'<div class="card mute">لا أحد بانتظار التواصل.</div>';
    Array.prototype.forEach.call($('view').querySelectorAll('[data-a]'),function(b){b.onclick=function(){contactAct(list[+b.getAttribute('data-i')],b.getAttribute('data-a'))}});
  },fail)
}
function contactAct(o,a){
  if(a==='done'){return api('staff_outreach_done',{outreach_id:o.id}).then(function(){toast('تم');refreshInbox();vContact()},fail)}
  api('staff_outreach_prepare',{outreach_id:o.id,channel:a}).then(function(r){
    if(a==='tg'&&r.sent){toast('أُرسلت عبر البوت');refreshInbox();return vContact()}
    if(r.fallback==='wa'){toast('تعذر الإرسال عبر البوت، استخدم واتساب',true);return contactAct(o,'wa')}
    if(r.wa_url){window.open(r.wa_url,'_blank','noopener');toast('فُتح واتساب، اضغط «تم» بعد الإرسال');refreshInbox()}
  },fail)
}

// ---------- التوقف ----------
var SR={busy:'انشغال أو ضيق وقت',exams:'الامتحانات أو الدراسة',price:'السعر',style:'الأسلوب أو الأستاذ',learned:'تعلّم ما يكفي',personal:'ظروف شخصية',other:'سبب آخر'},SW={month:'بعد شهر',three_months:'بعد 3 أشهر',after_exams:'بعد الامتحانات',summer:'في الصيف',unknown:'لا يعرف بعد'};
function vStops(){
  api('staff_stops_list').then(function(r){
    var keys=Object.keys(r.counts).sort(function(a,b){return r.counts[b]-r.counts[a]});
    function card(x,done){return '<div class="card"><div class="row"><b>'+esc(x.person.name)+'</b><span class="tag'+(x.stop_type==='final'&&!done?' urgent':'')+'">'+(x.stop_type==='final'?'نهائي':'مؤقت')+'</span></div><div class="mute"><span class="amt">'+esc(x.person.phone)+'</span> · '+esc(x.group_code)+' · '+esc(ago(x.created_at))+'</div><p style="margin:8px 0 0;font-weight:700">'+x.reasons.map(function(k){return esc(SR[k]||k)}).join(' · ')+'</p>'+(x.resume_when?'<p class="mute" style="margin:4px 0 0">ينوي المواصلة: '+esc(SW[x.resume_when]||x.resume_when)+'</p>':'')+(x.comment?'<p class="mute" style="margin:6px 0 0">«'+esc(x.comment)+'»</p>':'')+
      (done?'<p class="mute" style="margin:6px 0 0">تمت المتابعة'+(x.handled.note?': '+esc(x.handled.note):'')+'</p>':'<div class="btns"><button class="btn" data-w="'+esc(x.id)+'">تم التواصل</button></div>')+'</div>'}
    $('view').innerHTML=(keys.length?'<div class="card"><b>ملخص الأسباب</b><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">'+keys.map(function(k){return '<span class="tag">'+esc(SR[k]||k)+' · '+r.counts[k]+'</span>'}).join('')+'</div></div>':'')+
      (r.open.length?r.open.map(function(x){return card(x,false)}).join(''):'<div class="card mute">لا توجد طلبات توقف بانتظار المتابعة.</div>')+(r.done.length?'<h2>تمت متابعتها</h2>'+r.done.map(function(x){return card(x,true)}).join(''):'');
    Array.prototype.forEach.call($('view').querySelectorAll('[data-w]'),function(b){b.onclick=function(){
      ask('<h2 style="margin:0">تسجيل المتابعة</h2><p class="mute">اكتب ما تم مع الطالب (اختياري).</p><textarea id="nt" placeholder="مثال: اتصلت به، سيعود في الصيف"></textarea><div class="btns"><button class="btn" id="ok">حفظ</button><button class="btn sec" id="no">إلغاء</button></div>',function(m){
        m.querySelector('#no').onclick=closeModal;m.querySelector('#ok').onclick=function(){var nt=m.querySelector('#nt').value;closeModal();api('staff_stop_done',{stop_id:b.getAttribute('data-w'),note:nt}).then(function(){toast('تم');refreshInbox();vStops()},function(e){fail(e);vStops()})}})}});
  },fail)
}

// ---------- الإعدادات ----------
function vSettings(){
  api('staff_settings_get').then(function(groups){
    var h=groups.map(function(g,gi){return '<details'+(gi===0?' open':'')+'><summary>'+esc(g.title)+'</summary>'+g.items.map(function(it){
      var f=it.kind==='json'?'<textarea data-k="'+esc(it.key)+'" data-d="'+esc(it.value)+'">'+esc(it.value)+'</textarea>':'<input data-k="'+esc(it.key)+'" data-d="'+esc(it.value)+'" class="'+(it.kind==='number'?'ltr':'')+'" '+(it.kind==='number'?'inputmode="decimal"':'')+' value="'+esc(it.value)+'">';
      return '<label>'+esc(it.label)+'</label>'+f}).join('')+'<div style="height:12px"></div></details>'}).join('');
    $('view').innerHTML=h+'<div class="btns"><button class="btn" id="save">حفظ التغييرات</button></div>';
    $('save').onclick=function(){
      var ch={};Array.prototype.forEach.call($('view').querySelectorAll('[data-k]'),function(e){if(e.value!==e.getAttribute('data-d'))ch[e.getAttribute('data-k')]=e.value});
      if(!Object.keys(ch).length)return toast('لا توجد تغييرات');
      api('staff_settings_set',{changes:ch}).then(function(r){toast('تم الحفظ ('+r.saved+')');vSettings()},fail)};
  },fail)
}

// ---------- الإقلاع ----------
(function(){var t=store('t');if(t){TOK=t;busy(true);api('staff_inbox',{},true).then(function(x){busy(false);INBOX=x;STAFF=x.staff;start()},function(){busy(false);showLogin('')})}else showLogin('')})();
})();
</script>
